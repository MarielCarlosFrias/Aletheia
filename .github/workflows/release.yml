name: Release

on:
  push:
    tags: ['v*']

# Escrita apenas no job que publica (o resto do workflow nao precisa
# de escrever no repositorio).
permissions:
  contents: read

concurrency:
  # Duas tags pushed em sequencia nao devem criar releases em paralelo.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-image-formats-plugins
      - name: Prepare ONNX Runtime and model (com retry)
        run: |
          # O file(DOWNLOAD) do CMake nao repete tentativas, e o GitHub ja
          # devolveu HTTP/2 PROTOCOL_ERROR neste projeto. Descarregamos
          # aqui, com retry, para o caminho default que o CMakeLists ja
          # procura (evita a descarga interna do CMake).
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-linux-x64-1.19.0.tgz
          echo '8627cae49b51544ed15bb70c8ecf25b187f22a301c99c1ced5f4f3af5c36b44c  /tmp/ort.tgz' | sha256sum --check
          tar -xzf /tmp/ort.tgz
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o u2netp.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          echo '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  u2netp.onnx' | sha256sum --check
      - run: cmake -S . -B build -G Ninja -DINSTALLED=ON -DBG_REMOVER_FETCH_ONNX_RUNTIME=ON -DBG_REMOVER_BUNDLE_MODELS=ON
      - run: cmake --build build --parallel
      - name: Test
        # Testar antes de empacotar: um binario que falha nos testes
        # nao deve chegar ao AppImage publicado.
        run: |
          # A saida do ctest tambem vai para as anotacoes do job: sem
          # isso, um teste que falha so deixa "exit code 8" no log.
          # O "set +e" e essencial: com "-e" o script aborta no ctest
          # (que falha) e a anotacao nunca chega a ser escrita.
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Test failure::$(sed 's/%/%25/g' ctest.log | tr '\n' '%0A' | head -c 6000)"
            exit "$status"
          fi
      - run: cpack --config build/CPackConfig.cmake -G DEB -B dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-deb
          path: dist/*.deb

  linux-appimage:
    # Mesmo runner do DEB: o Ubuntu 22.04 tem Qt 6.2/CMake 3.22 e o
    # configure falha; a compatibilidade de glibc do 24.04 cobre a
    # grande maioria das distros ativas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-image-formats-plugins file
      - name: Prepare ONNX Runtime and model (com retry)
        run: |
          # O file(DOWNLOAD) do CMake nao repete tentativas, e o GitHub ja
          # devolveu HTTP/2 PROTOCOL_ERROR neste projeto. Descarregamos
          # aqui, com retry, para o caminho default que o CMakeLists ja
          # procura (evita a descarga interna do CMake).
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-linux-x64-1.19.0.tgz
          echo '8627cae49b51544ed15bb70c8ecf25b187f22a301c99c1ced5f4f3af5c36b44c  /tmp/ort.tgz' | sha256sum --check
          tar -xzf /tmp/ort.tgz
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o u2netp.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          echo '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  u2netp.onnx' | sha256sum --check
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DINSTALLED=ON \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBG_REMOVER_FETCH_ONNX_RUNTIME=ON \
            -DBG_REMOVER_BUNDLE_MODELS=ON
          cmake --build build --parallel
      - name: Test
        run: |
          # A saida do ctest tambem vai para as anotacoes do job: sem
          # isso, um teste que falha so deixa "exit code 8" no log.
          # O "set +e" e essencial: com "-e" o script aborta no ctest
          # (que falha) e a anotacao nunca chega a ser escrita.
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Test failure::$(sed 's/%/%25/g' ctest.log | tr '\n' '%0A' | head -c 6000)"
            exit "$status"
          fi
      - name: Install into AppDir
        run: DESTDIR=appdir cmake --install build
      - name: Build AppImage
        run: |
          # O upstream so publica builds "continuous" (nao ha versoes
          # assinadas). A integridade e verificada com o SHA-1 do
          # ficheiro .zsync do proprio upstream: assim o binario usado
          # so muda quando o upstream publica um novo build.
          fetch_checked() {
            name="$1"; repo="$2"
            if [ ! -f "/tmp/$name" ]; then
              wget -q "https://github.com/$repo/releases/download/continuous/$name" -O "/tmp/$name"
              wget -q "https://github.com/$repo/releases/download/continuous/$name.zsync" -O "/tmp/$name.zsync"
              # O .zsync e binario ( alem do cabecalho tem os blocos de
              # checksum): o grep precisa de -a para o ler.
              expected=$(grep -a -m1 -i '^SHA-1:' "/tmp/$name.zsync" | awk '{print $2}')
              actual=$(sha1sum "/tmp/$name" | awk '{print $1}')
              if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
                echo "ERRO: checksum invalido para $name (esperado $expected, obtido $actual)"
                exit 1
              fi
              echo "OK: $name verificado ($actual)"
            fi
          }
          fetch_checked linuxdeploy-x86_64.AppImage linuxdeploy/linuxdeploy
          fetch_checked linuxdeploy-plugin-qt-x86_64.AppImage linuxdeploy/linuxdeploy-plugin-qt
          chmod +x /tmp/linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=/usr/bin/qmake6
          export VERSION="${GITHUB_REF_NAME#v}"
          export UPDATE_DESKTOP_FILE=1
          /tmp/linuxdeploy-x86_64.AppImage --appdir appdir \
            -e appdir/usr/bin/aletheia \
            -e appdir/usr/bin/aletheia_cli \
            -i appdir/usr/share/icons/hicolor/scalable/apps/aletheia.svg \
            -d appdir/usr/share/applications/aletheia.desktop \
            --plugin qt --output appimage
          mv *.AppImage "aletheia_${VERSION}_amd64.AppImage"
          ls -la aletheia_*.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-appimage
          path: aletheia_*_amd64.AppImage

  windows-zip:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache Qt 6.7.3
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: Qt
          key: qt-windows-6.7.3-${{ hashFiles('.github/workflows/release.yml') }}
      - name: Install aqt (pip)
        shell: pwsh
        run: |
          python -m pip install aqtinstall

      - name: Download Qt 6.7.3 (aqt)
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 -O Qt
          $qtDir = "$PWD\Qt\6.7.3\msvc2019_64"
          Add-Content $env:GITHUB_PATH "$qtDir\bin"
          "CMAKE_PREFIX_PATH=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download bundled model
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx -OutFile u2netp.onnx
          if ((Get-FileHash u2netp.onnx -Algorithm SHA256).Hash.ToLower() -ne '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8') { throw 'Checksum do modelo invalido' }
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DINSTALLED=ON -DBG_REMOVER_FETCH_ONNX_RUNTIME=ON -DBG_REMOVER_BUNDLE_MODELS=ON
      - run: cmake --build build --config Release --parallel
      - name: Test
        shell: pwsh
        run: |
          # A saida do ctest tambem vai para as anotacoes do job.
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath ctest.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $c = (Get-Content ctest.log -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Test failure::$($c.Substring(0, [Math]::Min(6000, $c.Length)))"
            exit $status
          }
      - run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-zip
          path: dist/*.zip

  macos-zip:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache Qt 6.7.3
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: Qt
          key: qt-macos-6.7.3-${{ hashFiles('.github/workflows/release.yml') }}
      - name: Install aqt and Qt 6.7.3
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop 6.7.3 clang_64 -O Qt
          # O aqt pode usar "macos" ou "clang_64" como pasta da
          # arquitetura; localizamos o binario e derivamos a raiz.
          MACDEPLOYQT="$(find "$PWD/Qt" -name macdeployqt -type f -print -quit)"
          test -n "$MACDEPLOYQT"
          QT_DIR="$(dirname "$(dirname "$MACDEPLOYQT")")"
          echo "QT_DIR=$QT_DIR" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT_DIR" >> "$GITHUB_ENV"
          echo "$QT_DIR/bin" >> "$GITHUB_PATH"
      - name: Prepare ONNX Runtime and model
        run: |
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-osx-universal2-1.19.0.tgz
          echo 'a40293ad13c166289a83b072421faa7883b5ae4694ad93d6445ac32bd08be6ab  /tmp/ort.tgz' | shasum -a 256 -c -
          tar -xzf /tmp/ort.tgz
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o u2netp.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          echo '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  u2netp.onnx' | shasum -a 256 -c -
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DINSTALLED=ON -DBG_REMOVER_FETCH_ONNX_RUNTIME=ON \
            -DBG_REMOVER_BUNDLE_MODELS=ON \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist"
          cmake --build build --parallel
      - name: Test
        run: |
          # A saida do ctest tambem vai para as anotacoes do job: sem
          # isso, um teste que falha so deixa "exit code 8" no log.
          # O "set +e" e essencial: com "-e" o script aborta no ctest
          # (que falha) e a anotacao nunca chega a ser escrita.
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Test failure::$(sed 's/%/%25/g' ctest.log | tr '\n' '%0A' | head -c 6000)"
            exit "$status"
          fi
      - name: Install and deploy bundle
        run: |
          cmake --install build
          APP=dist/Aletheia.app
          "$QT_DIR/bin/macdeployqt" "$APP" -always-overwrite \
            -executable="$APP/Contents/MacOS/aletheia_cli"
      - name: Verify and package
        run: |
          APP=dist/Aletheia.app
          test -x "$APP/Contents/MacOS/Aletheia"
          test -x "$APP/Contents/MacOS/aletheia_cli"
          test -f "$APP/Contents/Resources/u2netp.onnx"
          test -f "$APP/Contents/Frameworks/libonnxruntime.dylib"
          echo "=== Dependencias de Aletheia ==="
          otool -L "$APP/Contents/MacOS/Aletheia"
          echo "=== Dependencias de aletheia_cli ==="
          otool -L "$APP/Contents/MacOS/aletheia_cli"
          otool -L "$APP/Contents/MacOS/Aletheia" | grep -q onnxruntime
          otool -L "$APP/Contents/MacOS/aletheia_cli" | grep -q onnxruntime
          otool -l "$APP/Contents/MacOS/aletheia_cli" | grep -q '@executable_path/../Frameworks'
          ! otool -L "$APP/Contents/MacOS/Aletheia" | grep -q "$QT_DIR"
          ! otool -L "$APP/Contents/MacOS/aletheia_cli" | grep -q "$QT_DIR"
          "$APP/Contents/MacOS/aletheia_cli" --version
          codesign --force --deep --sign - "$APP"
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent "$APP" "aletheia_${VERSION}_macos_universal2.zip"
          ls -lh aletheia_*_macos_universal2.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-zip
          path: aletheia_*_macos_universal2.zip

  publish:
    needs: [linux-deb, linux-appimage, windows-zip, macos-zip]
    permissions:
      contents: write
    # Publica apenas quando TODOS os pacotes ficaram prontos. Com a
    # regra anterior ("qualquer um com sucesso") a v1.2.3 foi publicada
    # so com o DEB: quem usa macOS ou Windows nao encontrava nada.
    # Os artefactos ficam sempre no CI, mesmo sem release.
    if: ${{ always() && !cancelled()
            && needs.linux-deb.result == 'success'
            && needs.linux-appimage.result == 'success'
            && needs.windows-zip.result == 'success'
            && needs.macos-zip.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check version matches the tag
        # Um pacote com a versao errada seria publicado em silencio.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(sed -n 's/^project(aletheia VERSION \([^)]*\)).*/\1/p' CMakeLists.txt | head -1)
          echo "tag=$TAG cmake=$CMAKE_VERSION"
          if [ "$TAG" != "$CMAKE_VERSION" ]; then
            echo "ERRO: a versao do CMakeLists ($CMAKE_VERSION) nao corresponde a tag ($TAG)"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256 checksums
        # Um unico SHA256SUMS cobre todos os pacotes publicados; e o
        # ficheiro que os utilizadores usam para verificar downloads.
        working-directory: dist
        run: |
          sha256sum aletheia_* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
          generate_release_notes: true
